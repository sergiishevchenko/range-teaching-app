<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Graph axes -->
  <line x1="20" y1="75" x2="80" y2="75" stroke="white" stroke-width="2"/>
  <line x1="20" y1="75" x2="20" y2="25" stroke="white" stroke-width="2"/>
  
  <!-- Data points (bubbles) representing range -->
  <circle cx="30" cy="65" r="4" fill="white" opacity="0.9"/>
  <circle cx="40" cy="55" r="5" fill="white" opacity="0.9"/>
  <circle cx="50" cy="45" r="6" fill="white" opacity="0.9"/>
  <circle cx="60" cy="35" r="7" fill="white" opacity="0.9"/>
  <circle cx="70" cy="30" r="5" fill="white" opacity="0.9"/>
  
  <!-- Range indicator arrow -->
  <path d="M 25 70 L 25 30" stroke="white" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
  <text x="15" y="50" fill="white" font-size="8" font-family="Arial">R</text>
</svg>

